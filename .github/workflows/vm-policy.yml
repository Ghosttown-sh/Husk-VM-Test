name: VM policy regression
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compile and execute the bounded VM policy regression
        run: |
          set -o pipefail
          mkdir -p build/evidence
          python3 tests/translation-layer/run_vm_pressure.py --cc clang 2>&1 | tee build/evidence/vm-policy-linux.log
          CC=clang sh tests/translation-layer/run_apk_path.sh 2>&1 | tee build/evidence/apk-path-linux.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: VM-policy-Linux-evidence
          path: build/evidence/
          retention-days: 14
