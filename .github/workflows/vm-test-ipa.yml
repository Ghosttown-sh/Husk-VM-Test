name: Husk VM Test IPA
on:
  workflow_dispatch:
    inputs:
      runner:
        description: Standard free Mac runner image
        type: choice
        default: macos-26
        options:
          - macos-26
          - macos-15
          - macos-15-intel

permissions:
  contents: read

jobs:
  # Standard hosted runners are free for public repositories. Never start this
  # job on a private repository where account billing/quotas could apply.
  build:
    if: github.event.repository.private == false && contains(fromJSON('["macos-26", "macos-15", "macos-15-intel"]'), inputs.runner)
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      HUSK_TEST_BUILD: '1'
      DD: ${{ github.workspace }}/build/derived-vm-test
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install public build tools
        run: |
          brew install xcodegen qemu
      - name: Test, build and validate using the provider-independent entry point
        run: bash scripts/build_vm_test.sh "$GITHUB_WORKSPACE/build/Husk-VM-Test.ipa"
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Husk-VM-Test-IPA
          path: build/Husk-VM-Test.ipa
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Husk-VM-Test-evidence
          path: |
            build/evidence/
            build/derived-vm-test/build.log
          retention-days: 14
